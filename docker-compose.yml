services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocerystore
      POSTGRES_USER: grocerystore
      POSTGRES_PASSWORD: grocerystore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocerystore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grocerystore
      SPRING_DATASOURCE_USERNAME: grocerystore
      SPRING_DATASOURCE_PASSWORD: grocerystore
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
